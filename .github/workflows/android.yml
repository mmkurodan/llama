name: Build native libs and APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read           # gh release list/download (Hexagon 成果物取得) に必要

# ──────────────────────────────────────────────────────────────────────────────
# Hexagon NPU サポートについて
#
# build-apk ジョブは build-hexagon-artifacts.yml が発行した最新の
# hexagon-artifacts-* Release を自動取得し、app/src/main/cpp/hexagon-artifacts/
# に展開 + skel を jniLibs/arm64-v8a/ に配置します。これにより CMakeLists.txt が
# Mode B (artifacts 自動検出) で GGML_HEXAGON=ON にしてビルドします。
#
# Release が存在しない場合 (まだ artifacts を発行していない等) は
# GGML_HEXAGON=OFF (NPU なし) でフォールバックビルドします。
#
# NPU 成果物の生成方法は build-hexagon-artifacts.yml / scripts/hexagon-files.md 参照。
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Job 1: mbedTLS ──────────────────────────────────────────────────────────
  build-mbedtls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake git build-essential

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build mbedTLS for arm64 (with -fPIC)
        run: |
          set -e
          export API=24
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/$HOST_TAG

          git clone --depth 1 --branch v3.5.1 https://github.com/Mbed-TLS/mbedtls.git
          cd mbedtls && mkdir build && cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=$API \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK \
            -DCMAKE_ANDROID_STL_TYPE=c++_static \
            -DCMAKE_C_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang \
            -DCMAKE_CXX_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++ \
            -DENABLE_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            -DCMAKE_INSTALL_PREFIX=$PWD/install

          make -j"$(nproc)" && make install

      - name: Upload mbedTLS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mbedtls-arm64
          path: mbedtls/build/install

  # ── Job 2: libcurl ──────────────────────────────────────────────────────────
  build-libcurl:
    runs-on: ubuntu-latest
    needs: build-mbedtls
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential git

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Download mbedTLS artifact
        uses: actions/download-artifact@v4
        with:
          name: mbedtls-arm64
          path: mbedtls-arm64

      - name: Build libcurl for arm64 (mbedTLS, no zlib)
        run: |
          set -e
          git clone --depth 1 --branch curl-8_5_0 https://github.com/curl/curl.git
          cd curl && autoreconf -fi

          export API=24
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/$HOST_TAG
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib

          ./configure \
            --host=aarch64-linux-android \
            --with-mbedtls=$GITHUB_WORKSPACE/mbedtls-arm64 \
            --disable-shared --enable-static \
            --without-zlib --without-zstd --without-brotli \
            --prefix=$PWD/build/arm64

          make -j"$(nproc)" && make install

      - name: Upload libcurl artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcurl-arm64
          path: curl/build/arm64

  # ── Job 3: APK ──────────────────────────────────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    needs: build-libcurl
    steps:
      - uses: actions/checkout@v4

      # ── keystore 復元 ───────────────────────────────────────────────────────
      - name: Restore keystore
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── サードパーティ libs ─────────────────────────────────────────────────
      - name: Download mbedTLS artifact
        uses: actions/download-artifact@v4
        with:
          name: mbedtls-arm64
          path: app/src/main/cpp/third_party/mbedtls

      - name: Download libcurl artifact
        uses: actions/download-artifact@v4
        with:
          name: libcurl-arm64
          path: app/src/main/cpp/third_party/libcurl

      # ── NDK ─────────────────────────────────────────────────────────────────
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      # ── Hexagon NPU 成果物を最新 Release から自動取得 ───────────────────────
      # build-hexagon-artifacts.yml が発行した hexagon-artifacts-* Release を取得し
      # app/src/main/cpp/hexagon-artifacts/ に展開、skel を jniLibs へ配置する。
      # Release が無ければ NPU 無しでビルド続行 (フォールバック)。
      - name: Fetch Hexagon artifacts from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="app/src/main/cpp/hexagon-artifacts"
          JNI="app/src/main/jniLibs/arm64-v8a"
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 50 \
                  --json tagName \
                  --jq '[.[].tagName | select(startswith("hexagon-artifacts-"))] | sort | last' \
                2>/dev/null || true)
          if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
            echo "ℹ️  hexagon-artifacts-* Release が無いため NPU 無しでビルドします。"
            exit 0
          fi
          echo "📥 Hexagon artifacts release: ${TAG}"
          mkdir -p /tmp/hexdl "${DEST}" "${JNI}"
          gh release download "${TAG}" --repo "${{ github.repository }}" \
            --pattern '*.tar.gz' --dir /tmp/hexdl --clobber
          TARBALL=$(ls /tmp/hexdl/*.tar.gz 2>/dev/null | head -1 || true)
          if [[ -z "${TARBALL}" ]]; then
            echo "::warning::Release ${TAG} に tar.gz アセットがありません。NPU 無しで継続。"
            exit 0
          fi
          # トップの hexagon-artifacts-vX.Y.Z/ を剥がし stub/ sdk-incs/ skel/ を直下へ
          tar -xzf "${TARBALL}" -C "${DEST}" --strip-components=1
          # DSP skel を jniLibs/arm64-v8a/ へ (APK 同梱、実行時に DSP ローダーが検出)
          if compgen -G "${DEST}/skel/*.so" > /dev/null; then
            cp "${DEST}/skel/"*.so "${JNI}/"
          fi
          echo "✅ placed under ${DEST}:"
          ( find "${DEST}" -maxdepth 2 \( -name '*.c' -o -name '*.so' \) | head -20 ) || true
          ls -la "${JNI}"/libggml-htp-*.so 2>/dev/null || true

      # ── Hexagon NPU サポート確認 (上記で取得できた場合のみ有効) ──────────────
      - name: Check Hexagon NPU availability
        id: hexagon
        run: |
          ARTIFACTS_DIR="app/src/main/cpp/hexagon-artifacts"
          STUB="${ARTIFACTS_DIR}/stub/htp_iface_stub.c"
          if [[ -f "${STUB}" ]]; then
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
            echo "✅ Hexagon NPU: ENABLED (artifacts found at ${ARTIFACTS_DIR})"
            find "${ARTIFACTS_DIR}" -maxdepth 3 -name "*.c" -o -name "*.h" -o -name "*.so" \
              | head -20
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Hexagon NPU: DISABLED"
            echo "   hexagon-artifacts/stub/htp_iface_stub.c が見つかりません"
            echo "   NPU 対応ビルドには scripts/hexagon-files.md を参照してください"
          fi

      # ── Gradle セットアップ ──────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle Wrapper (8.7)
        run: gradle wrapper --gradle-version 8.7

      # ── APK ビルド ──────────────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 16KB page-size 検証 ─────────────────────────────────────────────────
      - name: Verify .so 16KB alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          READELF="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          # libggml-htp-*.so は Hexagon DSP バイナリで Android リンカがロードせず
          # 16KB ページ要件の対象外のため除外する
          mapfile -t SO_FILES < <(unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' | grep -v '/libggml-htp-' || true)
          [[ ${#SO_FILES[@]} -eq 0 ]] && { echo "No .so files"; exit 0; }
          FAIL=0
          for so in "${SO_FILES[@]}"; do
            tmp_so="$(mktemp)"
            unzip -p "$APK" "$so" > "$tmp_so"
            if ! "$READELF" -l "$tmp_so" \
              | awk '/LOAD/ { if ($0 !~ /0x4000[[:space:]]*$/) bad=1 } END { exit bad }'; then
              echo "❌ $so: 0x4000 alignment NG"
              FAIL=1
            else
              echo "✅ $so"
            fi
            rm -f "$tmp_so"
          done
          exit $FAIL

      # ── AAB ─────────────────────────────────────────────────────────────────
      - name: Build AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── ビルドサマリー ───────────────────────────────────────────────────────
      - name: Build summary
        run: |
          NPU_STATUS="${{ steps.hexagon.outputs.enabled == 'true' && 'ENABLED' || 'DISABLED' }}"
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hexagon NPU | ${NPU_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            SIZE=$(du -sh app/build/outputs/apk/release/app-release.apk | cut -f1)
            echo "| Release APK | ${SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "--- Native libs in APK ---"
          unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep '\.so$' || true

      # ── アーティファクトアップロード ─────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release${{ steps.hexagon.outputs.enabled == 'true' && '-npu' || '' }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab${{ steps.hexagon.outputs.enabled == 'true' && '-npu' || '' }}
          path: app/build/outputs/bundle/release/app-release.aab
