name: Build native libs and APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
# NPU note: Hexagon/HTP NPU support was REMOVED from this repo to avoid Qualcomm
# Hexagon SDK (Community Version) redistribution restrictions on the compiled HTP
# skels (they statically link Qualcomm QuRT runtime). The build is CPU/GPU-only
# (GGML_HEXAGON stays OFF). The vendored ggml-hexagon sources are kept but never
# compiled. Backup + how to re-enable: local /root/llama-npu-backup/.
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Job 1: mbedTLS ──────────────────────────────────────────────────────────
  build-mbedtls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake git build-essential

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build mbedTLS for arm64 (with -fPIC)
        run: |
          set -e
          export API=24
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/$HOST_TAG

          git clone --depth 1 --branch v3.5.1 https://github.com/Mbed-TLS/mbedtls.git
          cd mbedtls && mkdir build && cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=$API \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK \
            -DCMAKE_ANDROID_STL_TYPE=c++_static \
            -DCMAKE_C_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang \
            -DCMAKE_CXX_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++ \
            -DENABLE_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            -DCMAKE_INSTALL_PREFIX=$PWD/install

          make -j"$(nproc)" && make install

      - name: Upload mbedTLS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mbedtls-arm64
          path: mbedtls/build/install

  # ── Job 2: libcurl ──────────────────────────────────────────────────────────
  build-libcurl:
    runs-on: ubuntu-latest
    needs: build-mbedtls
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential git

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Download mbedTLS artifact
        uses: actions/download-artifact@v4
        with:
          name: mbedtls-arm64
          path: mbedtls-arm64

      - name: Build libcurl for arm64 (mbedTLS, no zlib)
        run: |
          set -e
          git clone --depth 1 --branch curl-8_5_0 https://github.com/curl/curl.git
          cd curl && autoreconf -fi

          export API=24
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/$HOST_TAG
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib

          ./configure \
            --host=aarch64-linux-android \
            --with-mbedtls=$GITHUB_WORKSPACE/mbedtls-arm64 \
            --disable-shared --enable-static \
            --without-zlib --without-zstd --without-brotli \
            --prefix=$PWD/build/arm64

          make -j"$(nproc)" && make install

      - name: Upload libcurl artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcurl-arm64
          path: curl/build/arm64

  # ── Job 3: APK ──────────────────────────────────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    needs: build-libcurl
    steps:
      - uses: actions/checkout@v4

      # ── keystore 復元 ───────────────────────────────────────────────────────
      - name: Restore keystore
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── サードパーティ libs ─────────────────────────────────────────────────
      - name: Download mbedTLS artifact
        uses: actions/download-artifact@v4
        with:
          name: mbedtls-arm64
          path: app/src/main/cpp/third_party/mbedtls

      - name: Download libcurl artifact
        uses: actions/download-artifact@v4
        with:
          name: libcurl-arm64
          path: app/src/main/cpp/third_party/libcurl

      # ── NDK ─────────────────────────────────────────────────────────────────
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      # ── OpenCL ICD loader: GPU(OpenCL/Adreno) backend のリンク用 libOpenCL.so ──
      # libggml-opencl.so (DLプラグイン) のリンクに必要。実行時は端末側 libOpenCL.so を使う。
      # gradle が使う NDK は ndkVersion 由来のため、候補 NDK の sysroot 全てに配置する。
      - name: Build OpenCL ICD loader (libOpenCL.so for linking)
        run: |
          set -euo pipefail
          sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader /tmp/ocl-icd
          cmake -S /tmp/ocl-icd -B /tmp/ocl-icd/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$GITHUB_WORKSPACE/app/src/main/cpp/third_party/opencl" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ocl-icd/build
          LIB="$(find /tmp/ocl-icd/build -name 'libOpenCL.so' | head -1)"
          [ -f "$LIB" ] || { echo "::error::libOpenCL.so not built"; exit 1; }
          ls -l "$LIB"
          # Pass the lib path to the gradle CMake build (NDK-agnostic; only used for linking,
          # the runtime driver comes from the device's libOpenCL.so).
          echo "OPENCL_STUB_LIB=$LIB" >> "$GITHUB_ENV"

      # ── Hexagon/HTP NPU: removed ──────────────────────────────────────────────
      # NPU support (Qualcomm Hexagon HTP skels) was removed from this repo to avoid
      # Hexagon SDK (Community Version) redistribution restrictions. No skels are
      # fetched or placed into jniLibs; GGML_HEXAGON stays OFF so the APK is
      # CPU/GPU-only. Backup + how to re-enable: local /root/llama-npu-backup/.

      # ── Gradle セットアップ ──────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # compileSdk/targetSdk 36 (Android 16) needs platform-36 + build-tools 36.
      # AGP does not auto-download platforms, so install them explicitly.
      - name: Install Android SDK 36 components
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      # AGP 8.9 requires Gradle 8.11.1+.
      - name: Download Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle Wrapper (8.11.1)
        run: gradle wrapper --gradle-version 8.11.1

      # ── APK ビルド ──────────────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 16KB page-size 検証 ─────────────────────────────────────────────────
      - name: Verify .so 16KB alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          READELF="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          # libggml-htp-*.so は Hexagon DSP バイナリで Android リンカがロードせず
          # 16KB ページ要件の対象外のため除外する
          mapfile -t SO_FILES < <(unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' | grep -v '/libggml-htp-' || true)
          [[ ${#SO_FILES[@]} -eq 0 ]] && { echo "No .so files"; exit 0; }
          FAIL=0
          for so in "${SO_FILES[@]}"; do
            tmp_so="$(mktemp)"
            unzip -p "$APK" "$so" > "$tmp_so"
            if ! "$READELF" -l "$tmp_so" \
              | awk '/LOAD/ { if ($0 !~ /0x4000[[:space:]]*$/) bad=1 } END { exit bad }'; then
              echo "❌ $so: 0x4000 alignment NG"
              FAIL=1
            else
              echo "✅ $so"
            fi
            rm -f "$tmp_so"
          done
          exit $FAIL

      # ── AAB ─────────────────────────────────────────────────────────────────
      - name: Build AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── ビルドサマリー ───────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            SIZE=$(du -sh app/build/outputs/apk/release/app-release.apk | cut -f1)
            echo "| Release APK | ${SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "--- Native libs in APK ---"
          unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep '\.so$' || true

      # ── アーティファクトアップロード ─────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
