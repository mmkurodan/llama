name: Build native libs and APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-mbedtls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y cmake git build-essential

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build mbedTLS for arm64 (with -fPIC)
        run: |
          set -e
          export API=24
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/$HOST_TAG

          git clone https://github.com/Mbed-TLS/mbedtls.git
          cd mbedtls
          git checkout v3.5.1

          mkdir build
          cd build

          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=$API \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK \
            -DCMAKE_ANDROID_STL_TYPE=c++_static \
            -DCMAKE_C_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android$API-clang \
            -DCMAKE_CXX_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android$API-clang++ \
            -DENABLE_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            -DCMAKE_INSTALL_PREFIX=$PWD/install

          make -j"$(nproc)"
          make install

      - name: Upload mbedTLS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mbedtls-arm64
          path: mbedtls/build/install

  build-libcurl:
    runs-on: ubuntu-latest
    needs: build-mbedtls
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y autoconf automake libtool pkg-config build-essential git

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Download mbedTLS artifact
        uses: actions/download-artifact@v4
        with:
          name: mbedtls-arm64
          path: mbedtls-arm64

      - name: Build libcurl for arm64 (mbedTLS, no zlib)
        run: |
          set -e
          git clone https://github.com/curl/curl.git
          cd curl
          git checkout curl-8_5_0

          autoreconf -fi

          export API=24
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/$HOST_TAG
          export CC=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib

          ./configure \
            --host=aarch64-linux-android \
            --with-mbedtls=$GITHUB_WORKSPACE/mbedtls-arm64 \
            --disable-shared \
            --enable-static \
            --without-zlib \
            --without-zstd \
            --without-brotli \
            --prefix=$PWD/build/arm64

          make -j"$(nproc)"
          make install

      - name: Upload libcurl artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcurl-arm64
          path: curl/build/arm64

  build-snapdragon-runtime-libs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build Snapdragon runtime libraries
        run: |
          set -euo pipefail
          cd app/src/main/cpp/llama
          cp docs/backend/snapdragon/CMakeUserPresets.json .
          cmake --preset arm64-android-snapdragon-release -B build-snapdragon \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON
          cmake --build build-snapdragon -j"$(nproc)"
          cmake --install build-snapdragon --prefix "$GITHUB_WORKSPACE/pkg-snapdragon/llama.cpp"

      - name: Stage Snapdragon runtime libraries
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/pkg-snapdragon/llama.cpp/lib"
          DEST="$GITHUB_WORKSPACE/snapdragon-jni-libs/arm64-v8a"
          mkdir -p "$DEST"

          cp "$SRC/libggml-base.so" "$DEST/"
          cp "$SRC/libggml-cpu.so" "$DEST/"
          cp "$SRC/libggml-hexagon.so" "$DEST/"
          if [ -f "$SRC/libggml-opencl.so" ]; then
            cp "$SRC/libggml-opencl.so" "$DEST/"
          fi

          mapfile -t HTP_LIBS < <(find "$SRC" -maxdepth 1 -type f -name 'libggml-htp-v*.so' | sort)
          if [ "${#HTP_LIBS[@]}" -eq 0 ]; then
            echo "Hexagon HTP runtime libraries were not produced" >&2
            exit 1
          fi
          cp "${HTP_LIBS[@]}" "$DEST/"
          ls -1 "$DEST"

      - name: Upload Snapdragon runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon-jni-libs-arm64
          path: snapdragon-jni-libs/arm64-v8a
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    needs:
      - build-libcurl
      - build-snapdragon-runtime-libs
    steps:
      - uses: actions/checkout@v4

      # ★ keystore を app/ に復元
      - name: Restore keystore
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Download mbedTLS artifact
        uses: actions/download-artifact@v4
        with:
          name: mbedtls-arm64
          path: app/src/main/cpp/third_party/mbedtls

      - name: Download libcurl artifact
        uses: actions/download-artifact@v4
        with:
          name: libcurl-arm64
          path: app/src/main/cpp/third_party/libcurl

      - name: Download Snapdragon runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: snapdragon-jni-libs-arm64
          path: snapdragon-jni-libs/arm64-v8a

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Download Gradle 8.7
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper (8.7)
        run: gradle wrapper --gradle-version 8.7

      - name: Bundle Snapdragon runtime libraries into jniLibs
        run: |
          set -euo pipefail
          DEST=app/src/main/jniLibs/arm64-v8a
          rm -rf "$DEST"
          mkdir -p "$DEST"

          SRC=snapdragon-jni-libs/arm64-v8a
          cp "$SRC/libggml-base.so" "$DEST/"
          cp "$SRC/libggml-cpu.so" "$DEST/"
          cp "$SRC/libggml-hexagon.so" "$DEST/"
          if [ -f "$SRC/libggml-opencl.so" ]; then
            cp "$SRC/libggml-opencl.so" "$DEST/"
          fi

          mapfile -t HTP_LIBS < <(find "$SRC" -maxdepth 1 -type f -name 'libggml-htp-v*.so' | sort)
          if [ "${#HTP_LIBS[@]}" -eq 0 ]; then
            echo "Hexagon HTP runtime libraries were not found in the downloaded artifact" >&2
            exit 1
          fi
          cp "${HTP_LIBS[@]}" "$DEST/"
          ls -1 "$DEST"

      - name: Build variant JNI libraries before assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:externalNativeBuildDebug :app:externalNativeBuildRelease --stacktrace --info

      - name: Verify native libraries before assemble
        run: |
          set -euo pipefail
          DEST=app/src/main/jniLibs/arm64-v8a

          REQUIRED_LIBS=(
            "$DEST/libggml-base.so"
            "$DEST/libggml-cpu.so"
            "$DEST/libggml-hexagon.so"
          )

          for lib in "${REQUIRED_LIBS[@]}"; do
            if [ ! -f "$lib" ]; then
              echo "Required native library is missing from jniLibs: $lib" >&2
              exit 1
            fi
          done

          if ! find "$DEST" -maxdepth 1 -type f -name 'libggml-htp-v*.so' | grep -q .; then
            echo "No libggml-htp-vXX.so library was staged into jniLibs" >&2
            exit 1
          fi

          resolve_jni_lib() {
            local variant="$1"
            shift

            local cmake_obj="app/build/intermediates/cmake/$variant/obj/arm64-v8a/libllama.so"
            if [ -f "$cmake_obj" ]; then
              printf '%s\n' "$cmake_obj"
              return 0
            fi

            local build_type
            local candidate
            for build_type in "$@"; do
              candidate="$(find "app/build/intermediates/cxx/$build_type" -type f -path '*/arm64-v8a/libllama.so' 2>/dev/null | sort | head -n 1 || true)"
              if [ -n "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done

            return 1
          }

          DEBUG_JNI_LIB="$(resolve_jni_lib debug Debug || true)"
          if [ -z "$DEBUG_JNI_LIB" ]; then
            echo "Debug libllama.so was not found in the Gradle native build outputs" >&2
            find app/build/intermediates -maxdepth 6 -type f -path '*/arm64-v8a/libllama.so' 2>/dev/null | sort >&2 || true
            exit 1
          fi

          RELEASE_JNI_LIB="$(resolve_jni_lib release Release RelWithDebInfo MinSizeRel || true)"
          if [ -z "$RELEASE_JNI_LIB" ]; then
            echo "Release libllama.so was not found in the Gradle native build outputs" >&2
            find app/build/intermediates -maxdepth 6 -type f -path '*/arm64-v8a/libllama.so' 2>/dev/null | sort >&2 || true
            exit 1
          fi

          echo "Debug JNI lib: $DEBUG_JNI_LIB"
          echo "Release JNI lib: $RELEASE_JNI_LIB"
          ls -1 "$DEST"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x externalNativeBuildDebug -x externalNativeBuildRelease --stacktrace --info

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x externalNativeBuildDebug -x externalNativeBuildRelease --stacktrace --info
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify required Snapdragon/JNI libraries inside APKs
        run: |
          set -euo pipefail

          for APK in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk; do
            echo "Checking packaged native libraries in $APK"
            LISTING="$(mktemp)"
            unzip -l "$APK" | tee "$LISTING"

            grep -F 'lib/arm64-v8a/libggml-base.so' "$LISTING"
            grep -F 'lib/arm64-v8a/libggml-cpu.so' "$LISTING"
            grep -F 'lib/arm64-v8a/libggml-hexagon.so' "$LISTING"
            grep -F 'lib/arm64-v8a/libllama.so' "$LISTING"
            grep -E 'lib/arm64-v8a/libggml-htp-v[0-9]+\.so' "$LISTING"

            rm -f "$LISTING"
          done

      - name: Verify .so 16KB compatibility with ApkAnalyzer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          READELF="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          mapfile -t SO_FILES < <(unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' || true)
          if [ ${#SO_FILES[@]} -eq 0 ]; then
            echo "No native .so files found in $APK"
            exit 0
          fi

          for so in "${SO_FILES[@]}"; do
            tmp_so="$(mktemp)"
            unzip -p "$APK" "$so" > "$tmp_so"

            if ! "$READELF" -l "$tmp_so" | awk '/LOAD/ { if ($0 !~ /0x4000[[:space:]]*$/) bad=1 } END { exit bad }'; then
              echo "❌ $so has a LOAD segment without 0x4000 alignment"
              "$READELF" -l "$tmp_so" | grep LOAD
              rm -f "$tmp_so"
              exit 1
            fi

            echo "✅ $so has 16KB (0x4000) LOAD alignment"
            rm -f "$tmp_so"
          done

      - name: Build AAB (bundleRelease)
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -x externalNativeBuildDebug -x externalNativeBuildRelease --stacktrace --info
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
