<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM AI Server – API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; padding: 0; background: #fafafa; }
    .topbar { display: none !important; }
  </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin="anonymous"></script>
<script>
const spec = {
  openapi: "3.0.3",
  info: {
    title: "LLM AI Server API",
    version: "1.0.0",
    description: "On-device LLM API server compatible with Ollama, OpenAI, Anthropic, and Gemini APIs.\n\n**Base URL**: `http://127.0.0.1:11434` (or the configured port)\n\n**Model names** correspond to profile names created in the app settings. The special name `default` refers to the currently active profile."
  },
  servers: [{ url: window.location.origin, description: "On-device server (current)" }],
  tags: [
    { name: "Ollama", description: "Ollama-compatible endpoints (`/api/*`)" },
    { name: "OpenAI", description: "OpenAI-compatible endpoints (`/v1/*`)" },
    { name: "Anthropic", description: "Anthropic-compatible endpoints (`/v1/messages`)" },
    { name: "Gemini", description: "Google Gemini-compatible endpoints (`/v1beta/*`)" },
    { name: "Server", description: "Server management, diagnostics, and model control" }
  ],
  components: {
    schemas: {
      SamplingOptions: {
        type: "object",
        description: "Per-request sampling parameter overrides. All fields are optional and override the profile defaults.",
        properties: {
          temperature:      { type: "number",  example: 0.7,   description: "Sampling temperature (0.0–2.0). Lower = more deterministic." },
          top_p:            { type: "number",  example: 0.9,   description: "Nucleus sampling: keep top tokens whose cumulative prob ≥ top_p." },
          top_k:            { type: "integer", example: 40,    description: "Keep only the top_k most probable tokens. 0 = disabled." },
          min_p:            { type: "number",  example: 0.05,  description: "Min-p sampling: discard tokens below min_p × max_token_prob." },
          typ_p:            { type: "number",  example: 1.0,   description: "Typical-p sampling. 1.0 = disabled." },
          repeat_penalty:   { type: "number",  example: 1.1,   description: "Repetition penalty (1.0 = no penalty, >1.0 penalises repeats)." },
          repeat_last_n:    { type: "integer", example: 64,    description: "Window of tokens considered for repeat penalty." },
          presence_penalty: { type: "number",  example: 0.0,   description: "OpenAI-style presence penalty." },
          frequency_penalty:{ type: "number",  example: 0.0,   description: "OpenAI-style frequency penalty." },
          mirostat:         { type: "integer", example: 0,     description: "Mirostat sampling mode. 0 = off, 1 = v1, 2 = v2." },
          mirostat_tau:     { type: "number",  example: 5.0,   description: "Mirostat target entropy τ." },
          mirostat_eta:     { type: "number",  example: 0.1,   description: "Mirostat learning rate η." },
          dynatemp_range:   { type: "number",  example: 0.0,   description: "Dynamic temperature range. 0 = disabled." },
          dynatemp_exponent:{ type: "number",  example: 1.0,   description: "Dynamic temperature exponent." },
          xtc_probability:  { type: "number",  example: 0.0,   description: "XTC (eXtreme Token Culling) probability. 0 = disabled." },
          xtc_threshold:    { type: "number",  example: 0.1,   description: "XTC minimum token probability threshold." },
          top_n_sigma:      { type: "number",  example: -1.0,  description: "Top-N-sigma sampling. -1 = disabled." },
          dry_multiplier:   { type: "number",  example: 0.0,   description: "DRY (Don't Repeat Yourself) multiplier. 0 = disabled." },
          dry_base:         { type: "number",  example: 1.75,  description: "DRY base." },
          dry_allowed_length:{ type: "integer",example: 2,     description: "DRY minimum sequence length before penalty applies." },
          dry_penalty_last_n:{ type: "integer",example: -1,    description: "DRY penalty window. -1 = entire context." },
          num_ctx:          { type: "integer", example: 2048,  description: "Override context size for this request." },
          num_predict:      { type: "integer", example: -1,    description: "Max tokens to predict. -1 = unlimited." },
          seed:             { type: "integer", example: -1,    description: "RNG seed. -1 = random." },
          stop:             { type: "array", items: { type: "string" }, description: "Stop sequences." }
        }
      },
      ConfigurationFields: {
        type: "object",
        description: "All profile configuration fields. Any of these can be passed directly in the request body or nested inside `overrides`.",
        properties: {
          nCtx:             { type: "integer", example: 2048,  description: "Context window size (tokens)." },
          nThreads:         { type: "integer", example: 4,     description: "CPU inference threads." },
          nBatch:           { type: "integer", example: 128,   description: "Prompt processing batch size." },
          nPredict:         { type: "integer", example: -1,    description: "Max output tokens. -1 = unlimited." },
          nCtxAutoExpand:   { type: "boolean", example: true,  description: "Automatically increase nCtx if the prompt exceeds it." },
          temp:             { type: "number",  example: 0.7,   description: "Default sampling temperature." },
          topP:             { type: "number",  example: 0.9 },
          topK:             { type: "integer", example: 40 },
          minP:             { type: "number",  example: 0.01 },
          typicalP:         { type: "number",  example: 1.0 },
          penaltyLastN:     { type: "integer", example: 64 },
          penaltyRepeat:    { type: "number",  example: 1.1 },
          penaltyFreq:      { type: "number",  example: 0.0 },
          penaltyPresent:   { type: "number",  example: 0.0 },
          mirostat:         { type: "integer", example: 0,     description: "0=off, 1=v1, 2=v2." },
          mirostatTau:      { type: "number",  example: 5.0 },
          mirostatEta:      { type: "number",  example: 0.1 },
          dynatempRange:    { type: "number",  example: 0.0 },
          dynatempExponent: { type: "number",  example: 1.0 },
          xtcProbability:   { type: "number",  example: 0.0 },
          xtcThreshold:     { type: "number",  example: 0.1 },
          topNSigma:        { type: "number",  example: -1.0 },
          dryMultiplier:    { type: "number",  example: 0.0 },
          dryBase:          { type: "number",  example: 1.75 },
          dryAllowedLength: { type: "integer", example: 2 },
          dryPenaltyLastN:  { type: "integer", example: -1 },
          drySequenceBreakers:{ type: "string",example: "\\n,:,\".*", description: "Comma-separated sequence-breaker characters." },
          streaming:        { type: "boolean", example: true,  description: "Enable streaming output by default." },
          enableThinking:   { type: "boolean", example: false, description: "Enable chain-of-thought thinking blocks." },
          useMmap:          { type: "boolean", example: true,  description: "Use memory-mapped file loading." },
          backendType:      { type: "integer", example: 0,     description: "0 = CPU, 1 = GPU (OpenCL/Adreno)." },
          gpuOffloadEnabled:{ type: "boolean", example: false },
          gpuOffloadLayers: { type: "integer", example: -1,   description: "Number of layers to offload to GPU. -1 = all." },
          gpuSwitchStabilization: { type: "integer", example: 0, description: "GPU reload stabilization delay. 0=none, 1=200ms, 2=300ms, 3=500ms." },
          kvCacheTypeK:     { type: "integer", example: 1,    description: "KV cache quantization for K: 0=f32, 1=f16, 2=q8_0, 3=q4_0, 4=q4_1, 5=iq4_nl, 6=q5_0, 7=q5_1." },
          kvCacheTypeV:     { type: "integer", example: 1,    description: "KV cache quantization for V (same values as kvCacheTypeK)." },
          systemPrompt:     { type: "string", description: "System prompt used when the API request does not provide one." },
          customChatTemplate: { type: "string", description: "Jinja2 chat template override. Leave blank for auto-detection." },
          multimodalProjectorUrl: { type: "string", description: "Path or URL of the mmproj GGUF file." },
          multimodalProjectorDisabled: { type: "boolean", example: false, description: "Disable mmproj even if auto-detected." },
          loraAdapterUrl:   { type: "string", description: "Path or URL of the LoRA adapter GGUF file." },
          loraAdapterScale: { type: "number", example: 1.0,  description: "LoRA adapter strength (0.0–1.0+)." },
          mtpEnabled:       { type: "boolean", example: false, description: "Enable MTP (Multi-Token Prediction) speculative decoding." },
          mtpNDraft:        { type: "integer", example: 2,    description: "Max tokens drafted per MTP step." },
          mtpModelReference:{ type: "string", description: "Draft model path for MTP. Empty = use the main model's own head." }
        }
      },
      OllamaUsage: {
        type: "object",
        properties: {
          total_duration:    { type: "integer", description: "Total wall-clock time (ns)." },
          load_duration:     { type: "integer", description: "Model load time (ns)." },
          prompt_eval_count: { type: "integer", description: "Number of input tokens." },
          prompt_eval_duration: { type: "integer", description: "Prompt evaluation time (ns)." },
          eval_count:        { type: "integer", description: "Number of output tokens." },
          eval_duration:     { type: "integer", description: "Generation time (ns)." }
        }
      },
      ModelDetails: {
        type: "object",
        properties: {
          format:            { type: "string", example: "gguf" },
          family:            { type: "string", example: "gemma" },
          families:          { type: "array", items: { type: "string" } },
          parameter_size:    { type: "string", example: "unknown" },
          quantization_level:{ type: "string", example: "unknown" }
        }
      }
    }
  },
  paths: {

    "/api/tags": {
      get: {
        tags: ["Ollama"],
        summary: "List all profiles (models)",
        description: "Returns all configured profiles. Each entry includes Ollama `models[]` format and OpenAI `data[]` format in the same response.",
        responses: {
          "200": {
            description: "Profile list",
            content: { "application/json": { schema: {
              type: "object",
              properties: {
                models: {
                  type: "array",
                  description: "Ollama-format list.",
                  items: {
                    type: "object",
                    properties: {
                      name:        { type: "string", example: "default" },
                      model:       { type: "string", example: "default" },
                      modified_at: { type: "string", example: "2025-01-01T00:00:00.000Z" },
                      size:        { type: "integer", description: "Model file size in bytes. 0 if not downloaded." },
                      details:     { "$ref": "#/components/schemas/ModelDetails" },
                      capabilities:{ type: "array", items: { type: "string" }, example: ["multimodal"] },
                      modalities:  { type: "object", properties: { vision: { type: "boolean" }, audio: { type: "boolean" } } }
                    }
                  }
                },
                data: {
                  type: "array",
                  description: "OpenAI-format list (same profiles).",
                  items: { type: "object" }
                }
              }
            }}}
          }
        }
      },
      post: {
        tags: ["Ollama"],
        summary: "List all profiles (POST alias)",
        responses: { "200": { description: "Same response as GET /api/tags." } }
      }
    },

    "/api/generate": {
      post: {
        tags: ["Ollama"],
        summary: "Generate text completion",
        description: "Generate a text completion for a given prompt. Streaming returns NDJSON lines; non-streaming returns a single JSON object.\n\n`keep_alive` controls whether the model stays loaded after the call: `0` = unload immediately, negative = keep indefinitely (default), or a duration string like `\"5m\"`, `\"1h\"`.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model", "prompt"],
            properties: {
              model:      { type: "string",  example: "default",     description: "Profile name. `default` uses the currently loaded profile." },
              prompt:     { type: "string",  example: "Why is the sky blue?", description: "Input prompt text." },
              system:     { type: "string",  description: "System prompt override (replaces the profile's system prompt for this request)." },
              stream:     { type: "boolean", default: true,          description: "Stream tokens as NDJSON. Set false for a single response." },
              format:     { type: "string",  example: "json",        description: "Force JSON output mode. Pass `\"json\"` to enable." },
              keep_alive: { description: "Keep model loaded duration. `0` = unload, `-1` = forever, `\"5m\"`, `\"1h\"` etc.", oneOf: [{ type: "integer" }, { type: "string" }], example: "5m" },
              options:    { "$ref": "#/components/schemas/SamplingOptions" },
              images:     { type: "array", items: { type: "string" }, description: "Base64-encoded images (for vision models)." }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Streaming: one NDJSON line per token. Final line has `done:true` and timing fields. Non-streaming: single JSON.",
            content: { "application/json": { schema: {
              type: "object",
              properties: {
                model:     { type: "string" },
                created_at:{ type: "string" },
                response:  { type: "string", description: "Generated text (non-streaming) or token chunk (streaming)." },
                thinking:  { type: "string", description: "Thinking/reasoning content, if enable_thinking is on." },
                done:      { type: "boolean" },
                context:   { type: "array", items: { type: "integer" }, description: "Token IDs of the full context (final chunk only)." },
                ...{ "$ref": "#/components/schemas/OllamaUsage" }
              }
            }}}
          }
        }
      }
    },

    "/api/chat": {
      post: {
        tags: ["Ollama"],
        summary: "Multi-turn chat completion",
        description: "Multi-turn chat. Supports text, base64/URL images, and audio (for multimodal models).\n\nContent blocks in messages: `text` (plain string or `{type:\"text\",text:\"...\"}`) and `image_url` / `input_audio` dicts in the `content` array. Also accepts `images` shorthand at message level.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model", "messages"],
            properties: {
              model:    { type: "string", example: "default" },
              messages: {
                type: "array",
                items: {
                  type: "object",
                  required: ["role", "content"],
                  properties: {
                    role:    { type: "string", enum: ["system", "user", "assistant", "tool"] },
                    content: {
                      description: "Plain string or array of content blocks: `{type:\"text\",text:\"...\"}`, `{type:\"image_url\",image_url:{url:\"data:image/jpeg;base64,...\"}}`, `{type:\"input_audio\",input_audio:{data:\"...\",format:\"wav\"|\"mp3\"}}`.",
                      oneOf: [{ type: "string" }, { type: "array", items: { type: "object" } }]
                    },
                    images:       { type: "array", items: { type: "string" }, description: "Shorthand: base64 images or HTTP(S) URLs (vision models only)." },
                    tool_calls:   { type: "array", items: { type: "object" }, description: "Tool call results (assistant role)." },
                    tool_call_id: { type: "string", description: "Tool call ID (tool role)." }
                  }
                }
              },
              stream:     { type: "boolean", default: true },
              format:     { type: "string",  example: "json", description: "Force JSON output: pass `\"json\"`." },
              keep_alive: { oneOf: [{ type: "integer" }, { type: "string" }], example: "5m" },
              options:    { "$ref": "#/components/schemas/SamplingOptions" },
              tools:      { type: "array", items: { type: "object" }, description: "OpenAI-style function tool definitions." },
              tool_choice:{ description: "Tool choice: `\"auto\"`, `\"none\"`, `\"required\"`, or `{type:\"function\",function:{name:\"...\"}}`.", oneOf: [{ type: "string" }, { type: "object" }] }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Streaming NDJSON (one `message.content` chunk per line, final line `done:true`) or single JSON.",
            content: { "application/json": { schema: {
              type: "object",
              properties: {
                model:   { type: "string" },
                created_at: { type: "string" },
                message: {
                  type: "object",
                  properties: {
                    role:       { type: "string", example: "assistant" },
                    content:    { type: "string", description: "Generated text." },
                    thinking:   { type: "string", description: "Chain-of-thought content (if enabled)." },
                    tool_calls: { type: "array", items: { type: "object" } }
                  }
                },
                done:    { type: "boolean" },
                ...{ "$ref": "#/components/schemas/OllamaUsage" }
              }
            }}}
          }
        }
      }
    },

    "/api/show": {
      post: {
        tags: ["Ollama"],
        summary: "Show profile / model info",
        description: "Returns detailed profile configuration including the chat template, model family, and capabilities.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model"],
            properties: { model: { type: "string", example: "default" } }
          }}}
        },
        responses: {
          "200": {
            description: "Profile info",
            content: { "application/json": { schema: {
              type: "object",
              properties: {
                license:      { type: "string" },
                modelfile:    { type: "string" },
                parameters:   { type: "string" },
                template:     { type: "string", description: "Active Jinja2 chat template." },
                details:      { "$ref": "#/components/schemas/ModelDetails" },
                model_info:   { type: "object" },
                capabilities: { type: "array", items: { type: "string" }, example: ["multimodal"] }
              }
            }}}
          },
          "404": { description: "Profile not found." }
        }
      }
    },

    "/api/embed": {
      post: {
        tags: ["Ollama"],
        summary: "Generate embeddings",
        description: "Generate embedding vectors for one or more input strings. The embedding dimensionality depends on the loaded model.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model", "input"],
            properties: {
              model: { type: "string", example: "default" },
              input: {
                description: "Single string or array of strings.",
                oneOf: [
                  { type: "string",  example: "Hello world" },
                  { type: "array",   items: { type: "string" }, example: ["Hello", "World"] }
                ]
              },
              keep_alive: { oneOf: [{ type: "integer" }, { type: "string" }] }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Embedding vectors",
            content: { "application/json": { schema: {
              type: "object",
              properties: {
                model:             { type: "string" },
                embeddings:        { type: "array", items: { type: "array", items: { type: "number" } }, description: "One float array per input string." },
                total_duration:    { type: "integer" },
                load_duration:     { type: "integer" },
                prompt_eval_count: { type: "integer", description: "Total number of tokens across all inputs." }
              }
            }}}
          }
        }
      }
    },

    "/api/embeddings": {
      post: {
        tags: ["Ollama"],
        summary: "Generate embeddings (legacy single-input)",
        description: "Legacy Ollama embedding endpoint. Accepts a single `prompt` string and returns a single `embedding` vector.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model", "prompt"],
            properties: {
              model:  { type: "string", example: "default" },
              prompt: { type: "string", example: "Hello world" }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Embedding vector",
            content: { "application/json": { schema: {
              type: "object",
              properties: { embedding: { type: "array", items: { type: "number" } } }
            }}}
          }
        }
      }
    },

    "/api/tokenize": {
      post: {
        tags: ["Ollama"],
        summary: "Tokenize text",
        description: "Tokenizes the input string using the active model's tokenizer and returns an array of token IDs.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model", "content"],
            properties: {
              model:   { type: "string", example: "default" },
              content: { type: "string", example: "Hello world" }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Token IDs",
            content: { "application/json": { schema: {
              type: "object",
              properties: { tokens: { type: "array", items: { type: "integer" }, example: [9259, 1902] } }
            }}}
          }
        }
      }
    },

    "/api/ps": {
      get: {
        tags: ["Ollama"],
        summary: "List currently loaded models",
        description: "Returns the model that is currently loaded in memory. At most one model is loaded at a time.",
        responses: {
          "200": {
            description: "Running models",
            content: { "application/json": { schema: {
              type: "object",
              properties: {
                models: {
                  type: "array",
                  items: {
                    type: "object",
                    properties: {
                      name:       { type: "string", example: "default" },
                      model:      { type: "string" },
                      size:       { type: "integer", description: "Model file size in bytes." },
                      digest:     { type: "string", example: "sha256:..." },
                      expires_at: { type: "string", example: "0001-01-01T00:00:00Z" },
                      size_vram:  { type: "integer" },
                      details:    { "$ref": "#/components/schemas/ModelDetails" }
                    }
                  }
                }
              }
            }}}
          }
        }
      }
    },

    "/api/delete": {
      delete: {
        tags: ["Ollama"],
        summary: "Delete a profile",
        description: "Deletes the named profile configuration. The underlying model file on disk is **not** deleted — only the profile entry is removed.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model"],
            properties: { model: { type: "string", example: "my-profile", description: "Profile name to delete." } }
          }}}
        },
        responses: {
          "200": { description: "Deleted successfully.", content: { "application/json": { schema: { type: "object", properties: { status: { type: "string", example: "success" } } } } } },
          "404": { description: "Profile not found." },
          "503": { description: "Model is busy (currently loaded and generating)." }
        }
      }
    },

    "/api/profiles": {
      post: {
        tags: ["Ollama"],
        summary: "Create or update a profile (model configuration)",
        description: "Creates a new profile (or updates an existing one when `overwrite:true`). The model file is **not** downloaded here — it is fetched lazily the first time the profile is loaded.\n\n**How parameters are merged:**\n1. Start with base: a copy of the `from` profile (if specified), else app defaults.\n2. Apply any top-level fields from this request (e.g. `nCtx`, `temp`).\n3. Apply `overrides` object last (highest priority).\n4. `name` and `model`/`modelUrl` are always authoritative.\n\n**`gguf_data` (one-shot import + profile creation):** provide a Base64-encoded GGUF binary and the server imports the file to local storage, then creates the profile pointing to it. `model` must contain the target filename (e.g. `\"my-model.gguf\"`).",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["name"],
            properties: {
              name: {
                type: "string",
                example: "my-llama-3",
                description: "**Required.** Profile name. Must be unique unless `overwrite:true`."
              },
              model: {
                type: "string",
                example: "https://huggingface.co/org/repo/resolve/main/model.gguf",
                description: "Model reference. Accepts:\n- HuggingFace URL (`https://huggingface.co/...`)\n- Local filename (e.g. `model.gguf`) — must already exist in the app's model storage\n- Alias: `modelUrl`"
              },
              from: {
                type: "string",
                example: "default",
                description: "Copy all settings from this existing profile as a starting point. Only `model` and explicit overrides are changed. Alias: `source`."
              },
              overwrite: {
                type: "boolean",
                default: false,
                description: "Allow overwriting an existing profile with the same name. Returns 409 if false and the profile exists."
              },
              gguf_data: {
                type: "string",
                description: "Base64-encoded GGUF model binary. When provided, the server imports the binary to local storage **before** creating the profile. `model` must contain the target filename (e.g. `\"my-model.gguf\"`). If `overwrite:true` and `model` is omitted, inherits the filename from the existing profile."
              },
              overrides: {
                type: "object",
                description: "Fine-grained parameter overrides applied last (highest priority). Accepts any field from `ConfigurationFields`.",
                "$ref": "#/components/schemas/ConfigurationFields"
              },
              nCtx:             { "$ref": "#/components/schemas/ConfigurationFields/properties/nCtx" },
              nThreads:         { "$ref": "#/components/schemas/ConfigurationFields/properties/nThreads" },
              nBatch:           { "$ref": "#/components/schemas/ConfigurationFields/properties/nBatch" },

    "/v1/chat/completions": {

        tags: ["OpenAI"],

        description: "OpenAI-compatible chat completions.\n\n- Streaming returns `text/event-stream` SSE (`data: {...}` chunks, final `data: [DONE]`).\n- Supports vision (`image_url` content parts) and audio (`input_audio` content parts) for multimodal models.\n- `reasoning_effort`: maps to enable_thinking (`\"low\"`=off, `\"medium\"`/`\"high\"`=on).\n- `reasoning_format`: `\"auto\"` (default), `\"none\"` (strip thinking), `\"raw\"` (expose thinking in content).",

            required: ["model", "messages"],
            properties: {

              stream:           { type: "boolean", default: false },
              temperature:      { type: "number" },
              top_p:            { type: "number" },
              max_tokens:       { type: "integer" },
              stop:             { type: "array", items: { type: "string" } },
              tools:            { type: "array", items: { type: "object" }, description: "Function tool definitions." },
              tool_choice:      { oneOf: [{ type: "string" }, { type: "object" }] },
              response_format:  { type: "object", properties: { type: { type: "string", enum: ["text", "json_object"] } }, description: "`{type:\"json_object\"}` enables JSON mode." },

    "/v1/messages": {
      post: {
        tags: ["Anthropic"],
        summary: "Messages",
        description: "Anthropic Messages API.\n\n**Content block types in `content` arrays:**\n- `{type:\"text\", text:\"...\"}` — plain text\n- `{type:\"image\", source:{type:\"base64\",media_type:\"image/jpeg\",data:\"...\"}}` — base64 image\n- `{type:\"image\", source:{type:\"url\",url:\"...\"}}` — image URL\n- `{type:\"document\", source:{type:\"text\",data:\"...\"}, title:\"...\"}` — plain-text document\n- `{type:\"document\", source:{type:\"base64\",media_type:\"application/pdf\",data:\"...\"}}` — PDF (rendered as images via PdfRenderer, up to 10 pages)\n- `{type:\"document\", source:{type:\"url\",url:\"...\"}}` — document URL (treated as image URL)\n- `{type:\"tool_use\", ...}` / `{type:\"tool_result\", ...}` — function calling round-trip\n- `{type:\"thinking\", thinking:\"...\"}` — prior thinking block (preserved as context)\n- `{type:\"redacted_thinking\"}` — silently dropped\n- `cache_control` attributes on blocks are accepted and silently ignored\n\n**`anthropic-beta` header:**\n- `interleaved-thinking-2025-05-14` — enables thinking without explicit `thinking` field",
        parameters: [
          { name: "anthropic-version", in: "header", schema: { type: "string", example: "2023-06-01" } },
          { name: "anthropic-beta",    in: "header", schema: { type: "string", example: "interleaved-thinking-2025-05-14" }, description: "Beta features flag." }
        ],
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model", "messages", "max_tokens"],
            properties: {
              model:       { type: "string",  example: "default" },
              messages:    { type: "array", items: { type: "object" }, description: "Array of `{role:\"user\"|\"assistant\", content}` objects." },
              system:      { type: "string",  description: "System prompt (string or array of text blocks)." },
              max_tokens:  { type: "integer", example: 1024 },
              stream:      { type: "boolean", default: false },
              temperature: { type: "number" },
              top_p:       { type: "number" },
              top_k:       { type: "integer" },
              tools:       { type: "array", items: { type: "object" }, description: "Tool definitions: `{name, description, input_schema}`." },
              tool_choice: { type: "object", description: "`{type:\"auto\"|\"any\"|\"tool\", name?}`." },
              thinking:    { type: "object", description: "Extended thinking: `{type:\"enabled\",budget_tokens:N}`." }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Message response or SSE stream (events: `message_start`, `content_block_start/delta/stop`, `message_delta`, `message_stop`).",
            content: { "application/json": { schema: {
              type: "object",
              properties: {
                id:          { type: "string" },
                type:        { type: "string", example: "message" },
                role:        { type: "string", example: "assistant" },
                content:     { type: "array", items: { type: "object" }, description: "Array of content blocks: `text`, `thinking`, `tool_use`." },
                model:       { type: "string" },
                stop_reason: { type: "string", enum: ["end_turn", "max_tokens", "tool_use"] },
                usage:       { type: "object", properties: { input_tokens: { type: "integer" }, output_tokens: { type: "integer" } } }
              }
            }}}
          }
        }
      }
    },

            properties: {
              contents:          { type: "array", items: { type: "object" } },
              systemInstruction: { type: "object" }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Token count.",
            content: { "application/json": { schema: { type: "object", properties: { totalTokens: { type: "integer" } } } } }
          }
        }
      }
    },

    "/v1beta/models/{model}:embedContent": {
      post: {
        tags: ["Gemini"],
        summary: "Embed content / batch embed",
        description: "Generates embeddings for one `content` object (single mode) or a `requests` array (batch mode, endpoint suffix `:batchEmbedContents` also accepted).\n\n- Single: `{content:{parts:[{text:\"...\"}]}}` → `{embedding:{values:[...]}}`\n- Batch:  `{requests:[{model,content},...]}`  → `{embeddings:[{values:[]},...]}`",
        parameters: [{ name: "model", in: "path", required: true, schema: { type: "string" }, example: "default" }],
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            properties: {
              content:  { type: "object", description: "Single mode: `{parts:[{text:\"...\"}]}`." },
              requests: { type: "array",  description: "Batch mode: `[{model:\"...\",content:{parts:[...]}}]`.", items: { type: "object" } }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Single: `{embedding:{values:[]}}`. Batch: `{embeddings:[{values:[]},...]}`.",
            content: { "application/json": { schema: { type: "object" } } }
          }
        }
      }
    },

    "/health": {
      get: {
        tags: ["Server"],
        summary: "Health check",
        responses: {
          "200": {
            description: "Server is running.",
            content: { "application/json": { schema: { type: "object", properties: { status: { type: "string", example: "ok" }, role: { type: "string", enum: ["model", "router"] }, webui: { type: "boolean" } } } } }
          }
        }
      }
    },

    "/v1/health": {
      get: {
        tags: ["Server"],
        summary: "Health check (v1 alias)",
        responses: { "200": { description: "Same as GET /health." } }
      }
    },

    "/props": {
      get: {
        tags: ["Server"],
        summary: "Server properties",
        description: "Returns current model properties and default generation settings in llama.cpp WebUI format. Accepts optional `?model=<name>` query parameter.",
        parameters: [{ name: "model", in: "query", schema: { type: "string" } }],
        responses: { "200": { description: "Server and model properties JSON." } }
      }
    },

    "/slots": {
      get: {
        tags: ["Server"],
        summary: "Server slots",
        description: "Returns the current generation slot state in llama.cpp WebUI format.",
        responses: { "200": { description: "Array of slot objects." } }
      }
    },

    "/lora-adapters": {
      get: {
        tags: ["Server"],
        summary: "List active LoRA adapters",
        description: "Returns the currently applied LoRA adapter(s), or an empty array if none are active.",
        responses: {
          "200": {
            description: "Active LoRA adapters.",
            content: { "application/json": { schema: {
              type: "array",
              items: { type: "object", properties: { id: { type: "integer" }, path: { type: "string" }, scale: { type: "number" } } }
            }}}
          }
        }
      }
    },

    "/models/load": {
      post: {
        tags: ["Server"],
        summary: "Load a model into memory",
        description: "Explicitly loads (or reloads) a profile's model into memory. The call blocks until the model is fully loaded. If the same model is already loaded, this is a no-op.\n\nUse this before sending generation requests to avoid cold-start latency, or to pre-warm a specific profile.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: {
            type: "object",
            required: ["model"],
            properties: {
              model: { type: "string", example: "default", description: "Profile name to load." }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Load result.",
            content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean" }, error: { type: "string" } } } } }
          },
          "503": { description: "Server is busy (another generation is running)." }
        }
      }
    },

    "/models/unload": {
      post: {
        tags: ["Server"],
        summary: "Unload the current model from memory",
        description: "Releases the loaded model and frees native memory. The request body is optional — omit it or send `{}`.\n\nIf `model` is specified, only unloads if the named profile is currently loaded.",
        requestBody: {
          required: false,
          content: { "application/json": { schema: {
            type: "object",
            properties: {
              model: { type: "string", description: "Profile name to unload. Defaults to the currently loaded model." }
            }
          }}}
        },
        responses: {
          "200": {
            description: "Unloaded (or already unloaded).",
            content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean" } } } } }
          },
          "503": { description: "Model is busy — unload skipped." }
        }
      }
    }
  }
};

window.onload = function () {
  SwaggerUIBundle({
    spec: spec,
    dom_id: '#swagger-ui',
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
    layout: "BaseLayout",
    deepLinking: true,
    tryItOutEnabled: true,
    requestInterceptor: function(req) {
      req.headers['Content-Type'] = 'application/json';
      return req;
    }
  });
};
</script>
</body>
</html>
