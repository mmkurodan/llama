<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- PWA -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#1b1f20" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="LLM AI" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- PWA: service worker registration + Android install prompt -->
		<script>
			(function () {
				if ('serviceWorker' in navigator) {
					window.addEventListener('load', function () {
						navigator.serviceWorker.register('sw.js').catch(function (e) {
							console.warn('SW registration failed', e);
						});
					});
				}
				var deferredPrompt = null;
				function standalone() {
					return window.matchMedia('(display-mode: standalone)').matches ||
						window.navigator.standalone === true;
				}
				function makeBanner() {
					if (document.getElementById('pwa-install-banner')) return null;
					var bar = document.createElement('div');
					bar.id = 'pwa-install-banner';
					bar.setAttribute('role', 'dialog');
					bar.style.cssText = [
						'position:fixed', 'left:12px', 'right:12px', 'bottom:12px', 'z-index:2147483647',
						'display:flex', 'align-items:center', 'gap:12px',
						'padding:12px 14px', 'border-radius:12px',
						'background:#1b1f20', 'color:#fff',
						'box-shadow:0 6px 24px rgba(0,0,0,.35)',
						'font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif',
						'max-width:520px', 'margin:0 auto'
					].join(';');
					bar.innerHTML =
						'<img src="icon-192.png" alt="" width="36" height="36" style="border-radius:8px;flex:0 0 auto"/>' +
						'<span style="flex:1 1 auto">このアプリをホーム画面に追加できます / Install this app</span>' +
						'<button id="pwa-install-yes" style="flex:0 0 auto;background:#ff8236;color:#1b1f20;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer">インストール</button>' +
						'<button id="pwa-install-no" aria-label="close" style="flex:0 0 auto;background:transparent;color:#aaa;border:0;font-size:20px;cursor:pointer;padding:0 4px">×</button>';
					document.body.appendChild(bar);
					return bar;
				}
				function showBanner() {
					if (standalone() || !deferredPrompt) return;
					var bar = makeBanner();
					if (!bar) return;
					bar.querySelector('#pwa-install-yes').addEventListener('click', function () {
						bar.remove();
						if (!deferredPrompt) return;
						deferredPrompt.prompt();
						deferredPrompt.userChoice.finally(function () { deferredPrompt = null; });
					});
					bar.querySelector('#pwa-install-no').addEventListener('click', function () {
						bar.remove();
					});
				}
				window.addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					deferredPrompt = e;
					if (document.readyState === 'complete') showBanner();
					else window.addEventListener('load', showBanner);
				});
				window.addEventListener('appinstalled', function () {
					deferredPrompt = null;
					var bar = document.getElementById('pwa-install-banner');
					if (bar) bar.remove();
				});
			})();
		</script>
	</body>
</html>
