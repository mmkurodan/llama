plugins {
    id 'com.android.application'
}

android {
    namespace "com.micklab.llama"
    compileSdk 35
    def prebuiltRuntimeBackendDir = file("src/main/jniLibs/arm64-v8a")
    def hasPrebuiltRuntimeBackends = new File(prebuiltRuntimeBackendDir, "libggml-base.so").exists()

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.micklab.llama"
        minSdk 24
        targetSdk 35

        // ★ GitHub Actions のビルド番号を versionCode に自動反映
        versionCode System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 1

        // ★ versionName も同じロジックで自動化
        versionName "1.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DLLAMA_ANDROID_BUILD_RUNTIME_BACKENDS=${hasPrebuiltRuntimeBackends ? "OFF" : "ON"}"
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion "27.2.12479018"
}

dependencies {
}
