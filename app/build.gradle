plugins {
    id 'com.android.application'
}

android {
    namespace "com.micklab.llama"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.micklab.llama"
        minSdk 24
        targetSdk 35

        // ★ GitHub Actions のビルド番号を versionCode に自動反映
        versionCode System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 1

        // ★ versionName も同じロジックで自動化
        versionName "1.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                // GPU(OpenCL) backend: CI passes the libOpenCL.so to link against
                // (NDK-agnostic). When unset, the OpenCL plugin is simply not built.
                def openclStubLib = System.getenv("OPENCL_STUB_LIB")
                if (openclStubLib) {
                    arguments "-DOPENCL_STUB_LIB=${openclStubLib}"
                }
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion "27.2.12479018"

    // DSP (Hexagon HTP) skel .so は FastRPC がファイルパスから読み込むため、
    // APK 内に圧縮格納せず必ず展開する (extractNativeLibs=true 相当)。
    // これをしないと libggml-htp-vXX.so が nativeLibraryDir に存在せず NPU が CPU にフォールバックする。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
}
